name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png www/
      - run: npx cap add android
      - name: App icon (optional)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RiskCalculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
